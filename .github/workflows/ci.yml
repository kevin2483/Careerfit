name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: lint
        run: make lint
      - name: unit tests
        run: make test
      - name: reproduce evaluation from public data and diff against committed results
        run: make check
