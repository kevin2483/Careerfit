# CareerFit 역량 태그 사전 (온톨로지) v0
# ----------------------------------------------------------------------------
# 만든 방법: 수집된 150개 공고(ds/de/mle) 본문을 훑어 '실제로 등장한' 표현만 수록.
# 상상으로 넣은 태그 없음. alias 는 본문에서 관찰된 표기 변형.
#
# 구조:
#   canonical: 정규화된 단일 태그 (정답셋·집계의 기준)
#   aliases:   본문에 나타나는 표기 변형들 (regex 베이스라인이 이걸로 매칭)
#   field:     주로 어느 필드에서 나오는가 (1=명시스택 2=서술역량 3=암묵조건)
#   parent:    상위 개념 (상위개념 매핑 별도 집계용, 계획서 4번)
#
# 주의: 이건 v0다. 라벨링하면서 빠진 태그·잘못된 alias 가 나온다.
#       그때마다 여기 고치고 lab_log 에 버전 변경을 남긴다.
# ============================================================================

# ── ① 프로그래밍 언어 (명시적, 난이도 낮음) ──────────────────────────────
languages:
